<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Zero to Hero 2026, where we are today: Week 3, near the end of Discover" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">
<style>
.bg{fill:#fbfaf7} .ink{fill:#1d1d1b} .q{fill:#6b6a66} .b{font-weight:600}
.dia{fill:#eef3ef;stroke:#8a8f88;stroke-width:1.25} .grid{stroke:#c9cbc4;stroke-dasharray:3 3}
.done{fill:#d5e5da} .acc{fill:#0b6b4f} .accl{stroke:#0b6b4f;stroke-width:1.25;stroke-dasharray:4 4}
.here{stroke:#c4542a;stroke-width:3} .heref{fill:#c4542a}
@media (prefers-color-scheme: dark) {
 .bg{fill:#0d1117} .ink{fill:#e6edf3} .q{fill:#9198a1} .dia{fill:#16231d;stroke:#6e7681} .grid{stroke:#30363d}
 .done{fill:#1f4433} .acc{fill:#3fb984} .accl{stroke:#3fb984} .here{stroke:#f0883e} .heref{fill:#f0883e}
}
</style>
<rect width="760" height="350" class="bg" rx="10"/>
<text x="24" y="32" font-size="16" class="ink b">Zero to Hero 2026 · where we are today</text>
<text x="24" y="52" class="q">Each diamond widens to explore and narrows to decide</text>

<text x="24" y="85" class="q">Diamond 1 · the problem</text>
<polygon points="24,175 200,95 290,175 200,255" class="dia"/>
<polygon points="24,175 162,112.3 162,237.7" class="done"/>
<line x1="200" y1="97" x2="200" y2="253" class="grid"/>
<text x="112" y="171" text-anchor="middle" font-size="13.5" class="ink b">Discover</text>
<text x="112" y="189" text-anchor="middle" class="q">Weeks 1–3</text>
<text x="245" y="171" text-anchor="middle" font-size="13.5" class="ink b">Define</text>
<text x="245" y="189" text-anchor="middle" class="q">Week 4</text>

<text x="316" y="85" class="q">Diamond 2 · the solution</text>
<polygon points="316,175 470,95 736,175 470,255" class="dia"/>
<line x1="470" y1="97" x2="470" y2="253" class="grid"/>
<line x1="590" y1="131" x2="590" y2="219" class="grid"/>
<text x="384" y="171" text-anchor="middle" font-size="13.5" class="ink b">Develop</text>
<text x="384" y="189" text-anchor="middle" class="q">Week 5</text>
<text x="530" y="171" text-anchor="middle" font-size="13.5" class="ink b">Test</text>
<text x="530" y="189" text-anchor="middle" class="q">Week 6</text>
<text x="660" y="171" text-anchor="middle" font-size="13.5" class="ink b">Deliver</text>
<text x="660" y="189" text-anchor="middle" class="q">Weeks 7–8</text>

<circle cx="24" cy="175" r="5" class="acc"/>
<text x="24" y="285" class="ink b">Spark Night · 19 Oct</text>
<line x1="430" x2="430" y1="112" y2="270" class="accl"/>
<text x="430" y="288" text-anchor="middle" class="ink b">Vibe Jam · 21 Nov</text>
<circle cx="736" cy="175" r="5" class="acc"/>
<text x="736" y="288" text-anchor="end" class="ink b">Demo Day · 12 Dec</text>

<line x1="162" y1="70" x2="162" y2="300" class="here"/>
<path d="M162 312 L154 298 L170 298 z" class="heref"/>
<circle cx="132" cy="330" r="4.5" class="heref"/>
<text x="142" y="334" font-size="13" class="b" style="fill:inherit"><tspan class="heref">You are here · Week 3</tspan></text>
